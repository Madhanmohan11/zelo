<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="zeloOrbitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c875"/>
      <stop offset="100%" stop-color="#008e50"/>
    </linearGradient>
  </defs>

  <!-- Green Circle Base with Thin White Ring Border -->
  <circle cx="50" cy="50" r="47" fill="url(#zeloOrbitBg)" stroke="#ffffff" stroke-width="2"/>

  <!-- Orbital Arc Curve -->
  <path d="M 21 64 A 33 33 0 1 0 50 17" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Stylized Bold 'Z' -->
  <path d="M 37 37 H 63 L 37 63 H 63" fill="none" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Three Orbit Dots -->
  <!-- Left Dot (9 o'clock) -->
  <circle cx="21" cy="64" r="5" fill="#ffffff"/>
  <!-- Top Dot (12 o'clock) -->
  <circle cx="50" cy="17" r="5" fill="#ffffff"/>
  <!-- Right Dot (4 o'clock) -->
  <circle cx="81" cy="57" r="5" fill="#ffffff"/>
</svg>
